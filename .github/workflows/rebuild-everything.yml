name: Rebuild everything and replace paper

on:
  workflow_dispatch:
  push:
    branches: [main, nss-core-implementation, fix/repository-test-errors]
    paths-ignore:
      - 'paper/nss_discount_curves.pdf'
      - 'paper/generated_empirical_results.tex'
      - 'paper/generated/**'
  pull_request:
    branches: [main, nss-core-implementation]

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install runtime dependency
        run: python -m pip install --upgrade pip matplotlib

      - name: Execute empirical estimation
        run: python -m empirical.run_comparison

      - name: Generate comparison plot
        run: python -m empirical.plot_comparison

      - name: Run complete unit and regression suite
        run: python -m unittest discover -s tests -v

      - name: Generate paper results section
        run: python -m empirical.generate_paper_results

      - name: Prepare generated figure
        run: |
          mkdir -p paper/generated
          cp results/greece_italy_discount_factors_2025-06.png paper/generated/greece_italy_discount_factors_2025-06.png

      - name: Compile regenerated paper
        uses: xu-cheng/latex-action@v3
        with:
          root_file: nss_discount_curves.tex
          working_directory: paper
          latexmk_use_xelatex: false
          args: -pdf -interaction=nonstopmode -halt-on-error

      - name: Verify regenerated paper exists
        run: test -s paper/nss_discount_curves.pdf

      - name: Upload complete reproducibility artifacts
        uses: actions/upload-artifact@v4
        with:
          name: complete-rebuild-${{ github.sha }}
          path: |
            results/nss_parameters_2025-06.csv
            results/discount_factors_2025-06.csv
            results/TRANSFORMATION_ASSUMPTION.txt
            results/greece_italy_discount_factors_2025-06.png
            paper/generated_empirical_results.tex
            paper/generated/greece_italy_discount_factors_2025-06.png
            paper/nss_discount_curves.pdf
          if-no-files-found: error

      - name: Replace tracked paper with regenerated version
        if: github.event_name != 'pull_request'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add paper/nss_discount_curves.pdf paper/generated_empirical_results.tex paper/generated/greece_italy_discount_factors_2025-06.png
          if git diff --cached --quiet; then
            echo 'Paper already matches regenerated output.'
          else
            git commit -m 'Regenerate empirical paper and artifacts'
            git push
          fi
