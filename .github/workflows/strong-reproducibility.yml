name: Strong reproducibility validation

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - 'paper/nss_discount_curves.pdf'
      - 'paper/generated_empirical_results.tex'
      - 'paper/generated/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install matplotlib
          python -m pip check

      - name: Compile Python sources
        run: python -m compileall -q empirical src tests

      - name: Run complete unit and regression suite
        run: python -m unittest discover -s tests -v

      - name: Run empirical estimation
        run: python -m empirical.run_comparison

      - name: Generate comparison plot
        run: python -m empirical.plot_comparison

      - name: Generate paper results section
        run: python -m empirical.generate_paper_results

      - name: Validate required empirical outputs
        run: |
          test -s results/nss_parameters_2025-06.csv
          test -s results/discount_factors_2025-06.csv
          test -s results/TRANSFORMATION_ASSUMPTION.txt
          test -s results/greece_italy_india_discount_factors_2025-06.png
          test -s paper/generated_empirical_results.tex

      - name: Validate empirical output schemas and finite values
        run: |
          python - <<'PY'
          import csv
          import math
          from pathlib import Path

          checks = {
              Path('results/nss_parameters_2025-06.csv'): [
                  'country', 'beta0', 'beta1', 'beta2', 'beta3', 'tau1', 'tau2', 'rmse'
              ],
              Path('results/discount_factors_2025-06.csv'): [
                  'maturity_years',
                  'greece_discount_factor',
                  'italy_discount_factor',
                  'india_discount_factor',
                  'difference_gr_minus_it',
                  'difference_gr_minus_in',
                  'difference_it_minus_in',
              ],
          }

          for path, expected in checks.items():
              with path.open(encoding='utf-8', newline='') as handle:
                  reader = csv.DictReader(handle)
                  assert reader.fieldnames == expected, (path, reader.fieldnames)
                  rows = list(reader)
              assert rows, path
              for row in rows:
                  for field in expected:
                      if field != 'country':
                          value = float(row[field])
                          assert math.isfinite(value), (path, field, row[field])

          print('Empirical schemas and finite-value checks: PASS')
          PY

      - name: Re-run estimation for deterministic reconstruction
        run: |
          cp results/nss_parameters_2025-06.csv /tmp/nss.before.csv
          cp results/discount_factors_2025-06.csv /tmp/discount_factors.before.csv
          cp results/TRANSFORMATION_ASSUMPTION.txt /tmp/assumption.before.txt
          cp paper/generated_empirical_results.tex /tmp/paper-results.before.tex
          python -m empirical.run_comparison
          python -m empirical.generate_paper_results
          cmp /tmp/nss.before.csv results/nss_parameters_2025-06.csv
          cmp /tmp/discount_factors.before.csv results/discount_factors_2025-06.csv
          cmp /tmp/assumption.before.txt results/TRANSFORMATION_ASSUMPTION.txt
          cmp /tmp/paper-results.before.tex paper/generated_empirical_results.tex
          echo 'Deterministic text/CSV reconstruction: PASS'

      - name: Verify compiled paper
        uses: xu-cheng/latex-action@v3
        with:
          root_file: nss_discount_curves.tex
          working_directory: paper
          latexmk_use_xelatex: false
          args: -pdf -interaction=nonstopmode -halt-on-error

      - name: Verify generated paper artifact
        run: test -s paper/nss_discount_curves.pdf

      - name: Upload strong validation bundle
        uses: actions/upload-artifact@v4
        with:
          name: strong-reproducibility-${{ github.sha }}
          if-no-files-found: error
          path: |
            results/nss_parameters_2025-06.csv
            results/discount_factors_2025-06.csv
            results/TRANSFORMATION_ASSUMPTION.txt
            results/greece_italy_india_discount_factors_2025-06.png
            paper/generated_empirical_results.tex
            paper/generated/greece_italy_india_discount_factors_2025-06.png
            paper/nss_discount_curves.pdf
