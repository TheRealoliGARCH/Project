name: U4 Stress Testing and Robustness

on:
  push:
    branches: ["main", "u4-stress-testing-robustness"]
  pull_request:
    branches: ["main"]

jobs:
  u4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python modules
        run: python -m compileall -q src tests
      - name: Run U4 tests
        run: python -m unittest discover -s tests -p 'test_u4_stress.py' -v
      - name: Run complete regression suite
        run: python -m unittest discover -s tests -v
