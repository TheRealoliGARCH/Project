name: U3 Welfare-Warfare Optimality

on:
  push:
    branches: ["main", "u3-welfare-warfare-optimality"]
  pull_request:
    branches: ["main"]

jobs:
  u3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python modules
        run: python -m compileall -q src tests
      - name: Run U3 tests
        run: python -m unittest discover -s tests -p 'test_u3_optimality.py' -v
      - name: Run complete regression suite
        run: python -m unittest discover -s tests -v
